services:
  - type: web
    name: AutoAnalyst-AI
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL_NAME
        value: gemini-3.8-flash
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_CACHE_ENABLED
        value: "true"

