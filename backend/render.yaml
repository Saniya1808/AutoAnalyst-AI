services:
  - type: web
    name: autoanalyst-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL_NAME
        value: gemini-3.8-flash
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_CACHE_ENABLED
        value: "true"

